<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<script>
(function(){
  // Preserve auth-recovery fragments and query parameters when moving off the root page.
  const hash=new URLSearchParams(location.hash.slice(1)),query=new URLSearchParams(location.search);
  const recovering=hash.get('type')==='recovery'||query.get('type')==='recovery'||
    hash.has('error')||query.has('error')||query.has('code')||query.has('token_hash');
  const dest=new URL(recovering?'./teacher/reset.html':'./teacher/',location.href);
  dest.search=location.search;
  dest.hash=location.hash;
  location.replace(dest.href);
})();
</script>
